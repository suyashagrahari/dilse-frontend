name: Frontend CI/CD (Dev)

on:
  push:
    branches: [dev]

concurrency:
  group: frontend-dev-deploy
  cancel-in-progress: false

jobs:
  # ── Job 1: Build & Type Check ───────────────────────────────────────────────
  build:
    name: Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      # NOTE: the full `next build` is NOT run here — the Docker stage below builds
      # the app once (and fails the pipeline on any build error). Running it here too
      # meant compiling the whole app twice, back-to-back. This job is now a fast
      # type-check gate only.

  # ── Job 2: Docker Build & Push ──────────────────────────────────────────────
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build
    outputs:
      tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Extract metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_HUB_USERNAME }}/dilse-frontend
          tags: |
            type=raw,value=dev-latest
            type=sha,prefix=dev-sha-,format=short

      # Persist the Dockerfile's `--mount=type=cache` dirs (npm store + .next/cache)
      # across CI runs so `next build` recompiles incrementally instead of cold.
      # (BuildKit cache mounts are otherwise lost on ephemeral runners.)
      - name: Restore & save build cache mounts
        uses: reproducible-containers/buildkit-cache-dance@v3.1.2
        with:
          cache-map: |
            {
              "npm-cache": "/root/.npm",
              "next-cache": "/app/.next/cache"
            }
          skip-extraction: false

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            NEXT_PUBLIC_APP_ENV=production
            NEXT_PUBLIC_PROD_API_URL=${{ secrets.NEXT_PUBLIC_DEV_API_URL }}
            NEXT_PUBLIC_PROD_SITE_URL=${{ secrets.NEXT_PUBLIC_DEV_SITE_URL }}
            NEXT_PUBLIC_PROD_ROOT_DOMAIN=${{ secrets.NEXT_PUBLIC_DEV_ROOT_DOMAIN }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_PROD_STRAPI_URL=${{ secrets.NEXT_PUBLIC_DEV_STRAPI_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 3: Deploy to EC2 ────────────────────────────────────────────────────
  deploy:
    name: Deploy to EC2 (Dev)
    runs-on: ubuntu-latest
    needs: docker
    environment: development

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 180s
          script: |
            /opt/dilse/scripts/deploy.sh frontend \
              ${{ secrets.DOCKER_HUB_USERNAME }}/dilse-frontend \
              dev-sha-$(echo "${{ github.sha }}" | cut -c1-7) \
              dev
