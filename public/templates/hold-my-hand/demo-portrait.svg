<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Illustrated placeholder portrait used in the Hold My Hand demo">
  <title>Demo portrait placeholder</title>
  <defs>
    <radialGradient id="bg" cx="42%" cy="34%" r="78%">
      <stop offset="0%" stop-color="#8A6A9E"/>
      <stop offset="45%" stop-color="#4A3560"/>
      <stop offset="100%" stop-color="#160F22"/>
    </radialGradient>
    <radialGradient id="skin" cx="36%" cy="28%" r="82%">
      <stop offset="0%" stop-color="#F6D2B4"/>
      <stop offset="52%" stop-color="#DCA981"/>
      <stop offset="100%" stop-color="#8C5C42"/>
    </radialGradient>
    <radialGradient id="neck" cx="50%" cy="10%" r="90%">
      <stop offset="0%" stop-color="#C38F6B"/>
      <stop offset="100%" stop-color="#6E432F"/>
    </radialGradient>
    <linearGradient id="hair" x1="20%" y1="0%" x2="85%" y2="95%">
      <stop offset="0%" stop-color="#4B3428"/>
      <stop offset="38%" stop-color="#2A1A14"/>
      <stop offset="100%" stop-color="#120A08"/>
    </linearGradient>
    <linearGradient id="shirt" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#3E3A63"/>
      <stop offset="100%" stop-color="#191636"/>
    </linearGradient>
    <linearGradient id="rim" x1="100%" y1="20%" x2="45%" y2="70%">
      <stop offset="0%" stop-color="#FFB98A" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#FFB98A" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="cheek" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E08A72" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#E08A72" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="softer" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>
  <ellipse cx="255" cy="230" rx="230" ry="215" fill="#B98FD0" opacity=".18" filter="url(#softer)"/>

  <!-- shoulders -->
  <path d="M78 600c8-108 78-166 222-186 144 20 214 78 222 186z" fill="url(#shirt)"/>
  <path d="M300 414c-88 12-142 46-172 96 44-34 100-52 172-56 72 4 128 22 172 56-30-50-84-84-172-96z" fill="#6A63A8" opacity=".35" filter="url(#soft)"/>

  <!-- neck -->
  <path d="M246 330h108v104c0 26-108 26-108 0z" fill="url(#neck)"/>
  <ellipse cx="300" cy="356" rx="66" ry="30" fill="#5A3526" opacity=".55" filter="url(#soft)"/>

  <!-- ears -->
  <ellipse cx="176" cy="252" rx="24" ry="34" fill="#C08B66"/>
  <ellipse cx="424" cy="252" rx="24" ry="34" fill="#C08B66"/>

  <!-- head -->
  <ellipse cx="300" cy="238" rx="130" ry="156" fill="url(#skin)"/>

  <!-- cheeks + shading -->
  <ellipse cx="228" cy="278" rx="46" ry="34" fill="url(#cheek)"/>
  <ellipse cx="372" cy="278" rx="46" ry="34" fill="url(#cheek)"/>
  <ellipse cx="300" cy="300" rx="86" ry="70" fill="#B87A55" opacity=".22" filter="url(#soft)"/>

  <!-- hair -->
  <path d="M300 62c-92 0-152 62-156 148-2 34 6 60 14 74 4-52 16-84 34-102 40 22 176 26 232-8 16 18 26 52 30 110 10-16 18-42 16-76C466 124 392 62 300 62z" fill="url(#hair)"/>
  <path d="M212 92c34-22 100-30 148-14-52-2-104 10-148 46z" fill="#7A5A46" opacity=".5" filter="url(#soft)"/>

  <!-- brows -->
  <path d="M226 208c22-14 52-14 70-2" stroke="#3A241A" stroke-width="11" stroke-linecap="round" fill="none" opacity=".85"/>
  <path d="M304 206c18-12 48-12 70 2" stroke="#3A241A" stroke-width="11" stroke-linecap="round" fill="none" opacity=".85"/>

  <!-- eyes -->
  <ellipse cx="252" cy="248" rx="24" ry="16" fill="#FBF3EA"/>
  <ellipse cx="348" cy="248" rx="24" ry="16" fill="#FBF3EA"/>
  <circle cx="254" cy="249" r="11" fill="#3B2317"/>
  <circle cx="346" cy="249" r="11" fill="#3B2317"/>
  <circle cx="258" cy="245" r="4" fill="#FFF" opacity=".9"/>
  <circle cx="350" cy="245" r="4" fill="#FFF" opacity=".9"/>
  <path d="M228 240c14-12 36-12 48-2" stroke="#2B1A12" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M324 238c12-10 34-10 48 2" stroke="#2B1A12" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- nose + mouth -->
  <path d="M300 258c-6 24-14 34-4 42 6 5 14 5 20 1" stroke="#9C6446" stroke-width="8" stroke-linecap="round" fill="none" opacity=".7"/>
  <path d="M268 334c18 14 46 14 64 0" stroke="#8E4F42" stroke-width="10" stroke-linecap="round" fill="none"/>
  <path d="M276 330c16 6 32 6 48 0" stroke="#D79A86" stroke-width="5" stroke-linecap="round" fill="none" opacity=".7"/>

  <!-- warm rim light, so grayscale and brightness actually have luminance to work with -->
  <path d="M300 82c92 0 146 66 146 156s-54 156-146 156z" fill="url(#rim)" opacity=".5"/>
  <ellipse cx="238" cy="150" rx="70" ry="40" fill="#FFF" opacity=".1" filter="url(#soft)"/>
</svg>
